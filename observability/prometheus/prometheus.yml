global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: front-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - front-service:4000

  - job_name: auth-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - auth-service:3000

  - job_name: analysis-store-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - analysis-store-service:3001

  - job_name: traefik
    metrics_path: /metrics
    static_configs:
      - targets:
          - traefik:8080

services:
  traefik:
    image: traefik:latest
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports:
      - "${TRAEFIK_WEB_PORT:-80}:80"
      - "127.0.0.1:${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    networks:
      - backend
    restart: unless-stopped

  front-service:
    image: ${FRONT_IMAGE}
    environment:
      PORT: "4000"
    networks:
      - backend
    labels:
      - traefik.enable=true
      - traefik.http.routers.front.rule=PathPrefix(`/`)
      - traefik.http.routers.front.entrypoints=web
      - traefik.http.routers.front.priority=1
      - traefik.http.services.front.loadbalancer.server.port=4000
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('node:http');const req=http.get({host:'127.0.0.1',port:4000,path:'/healthz',timeout:2000},res=>process.exit(res.statusCode===200?0:1));req.on('error',()=>process.exit(1));"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  auth-service:
    image: ${AUTH_IMAGE}
    environment:
      PORT: "3000"
      NODE_ENV: ${AUTH_NODE_ENV:-production}
      STRICT_ENV: ${AUTH_STRICT_ENV:-true}
      DATABASE_URL: ${AUTH_DATABASE_URL:-mongodb://mongo:27017}
      DB_NAME: ${AUTH_DB_NAME}
      JWT_SECRET: ${AUTH_JWT_SECRET}
      JWT_EXPIRES_IN: ${AUTH_JWT_EXPIRES_IN}
      JWT_ISSUER: ${AUTH_JWT_ISSUER:-}
      JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-}
      SALT: ${AUTH_SALT}
      ADMIN_EMAIL: ${AUTH_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD}
      ADMIN_PSEUDO: ${AUTH_ADMIN_PSEUDO}
    networks:
      - backend
    depends_on:
      mongo:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.auth.rule=PathPrefix(`/auth`) || PathPrefix(`/users`) || PathPrefix(`/me`) || PathPrefix(`/health`)
      - traefik.http.routers.auth.entrypoints=web
      - traefik.http.routers.auth.priority=100
      - traefik.http.services.auth.loadbalancer.server.port=3000
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('node:http');const req=http.get({host:'127.0.0.1',port:3000,path:'/health',timeout:2000},res=>process.exit(res.statusCode===200?0:1));req.on('error',()=>process.exit(1));"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  mongo:
    image: mongo:7.0.18
    command: ["--bind_ip_all"]
    environment:
      MONGO_INITDB_DATABASE: ${AUTH_DB_NAME}
    volumes:
      - mongo-data:/data/db
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "mongodb://127.0.0.1:27017/admin", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  analysis-store-service:
    image: ${ANALYSIS_STORE_IMAGE}:${ANALYSIS_STORE_IMAGE_TAG}
    profiles: ["analysis-store"]
    environment:
      NODE_ENV: ${ANALYSIS_STORE_NODE_ENV:-production}
      PORT: "3001"
      DATABASE_URL: ${ANALYSIS_STORE_DATABASE_URL:-postgres://analysis_store:${ANALYSIS_STORE_DB_PASSWORD}@postgres:5432/analysis_store}
      MASTER_KEY: ${ANALYSIS_STORE_MASTER_KEY}
      CRYPTO_KEY_VERSION: ${ANALYSIS_STORE_CRYPTO_KEY_VERSION:-v1}
      DB_NAME: ${ANALYSIS_STORE_DB_NAME:-analysis_store}
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.analysis-store.rule=PathPrefix(`/analysis-store`)
      - traefik.http.routers.analysis-store.entrypoints=web
      - traefik.http.routers.analysis-store.priority=90
      - traefik.http.services.analysis-store.loadbalancer.server.port=3001
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('node:http');const req=http.get({host:'127.0.0.1',port:3001,path:'/api/health',timeout:2000},res=>process.exit(res.statusCode===200?0:1));req.on('error',()=>process.exit(1));"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    profiles: ["analysis-store"]
    environment:
      POSTGRES_DB: ${ANALYSIS_STORE_DB_NAME:-analysis_store}
      POSTGRES_USER: ${ANALYSIS_STORE_DB_USER:-analysis_store}
      POSTGRES_PASSWORD: ${ANALYSIS_STORE_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ANALYSIS_STORE_DB_USER:-analysis_store} -d ${ANALYSIS_STORE_DB_NAME:-analysis_store}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped


networks:
  backend:
    name: infra-backend

volumes:
  mongo-data:
  postgres-data:

name: Publish infra image

on:
  push:
    tags:
      - "v.*.*.*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  PROD_BRANCH: prod

jobs:
  publish:
    name: Build and publish GHCR image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag and prod ancestry
        id: release
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${tag}' must match v.X.Y.Z, for example v.1.0.0."
            exit 1
          fi

          tagged_commit="$(git rev-list -n 1 "refs/tags/${tag}")"
          git fetch --no-tags origin "${PROD_BRANCH}:refs/remotes/origin/${PROD_BRANCH}"

          if ! git merge-base --is-ancestor "${tagged_commit}" "origin/${PROD_BRANCH}"; then
            echo "::error::Tagged commit ${tagged_commit} is not part of origin/${PROD_BRANCH}."
            exit 1
          fi

          repository="${GITHUB_REPOSITORY,,}"
          version="${tag#v.}"

          {
            echo "image=${REGISTRY}/${repository}"
            echo "version=${version}"
            echo "tagged_commit=${tagged_commit}"
            echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.release.outputs.image }}:latest
            ${{ steps.release.outputs.image }}:prod
            ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
          build-args: |
            CREATED=${{ steps.release.outputs.created }}
            REVISION=${{ steps.release.outputs.tagged_commit }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
            VERSION=${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.created=${{ steps.release.outputs.created }}
            org.opencontainers.image.revision=${{ steps.release.outputs.tagged_commit }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}

      - name: Write publish summary
        shell: bash
        run: |
          cat <<'SUMMARY' >> "${GITHUB_STEP_SUMMARY}"
          ## GHCR publication

          Published private package:

          - `${{ steps.release.outputs.image }}:latest`
          - `${{ steps.release.outputs.image }}:prod`
          - `${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}`

          Digest:

          - `${{ steps.build.outputs.digest }}`
          SUMMARY
